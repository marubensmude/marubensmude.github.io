<style>
:root{--ink:#0d0d0d;--gold:#e0b026;--gold-d:#a8821c;--paper:#f6f3ee;--line:#e4ddd0;--muted:#77706a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 24px}
.wrap{width:100%;max-width:640px;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.08);overflow:hidden}
.bar{background:var(--ink);color:#fff;text-align:center;font-size:11px;letter-spacing:.34em;padding:13px 10px;text-transform:uppercase}
.bar b{color:var(--gold);font-weight:500}
.in{padding:28px 32px 32px;text-align:center}
.in img{width:84px;height:auto}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:32px;margin:10px 0 4px;line-height:1.15}
.rule{width:60px;height:2px;background:var(--gold);margin:14px auto 22px}
.box{text-align:left;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.65;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;background:var(--ink);color:#fff;margin-top:20px;width:100%}
.empty{color:var(--muted);font-weight:300;line-height:1.6}
footer{margin-top:20px;font-size:12px;color:var(--muted);text-align:center;font-weight:300}
footer b{color:var(--ink);font-weight:500}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

(function(){
  function dec(s){ try { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; var bin = atob(s), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); } catch(e){ return ''; } }
  var p = new URLSearchParams(location.hash.slice(1)), txt = dec(p.get('t') || ''), h = dec(p.get('h') || '');
  var T = document.getElementById('t');
  if (h){ document.getElementById('h').textContent = h; document.title = h + ' · Mude Imóveis'; }
  if (txt){ T.textContent = txt; }
  else { T.className = 'box empty'; T.textContent = 'Nenhum conteúdo foi encontrado neste link. Confira se ele foi copiado por inteiro.'; document.getElementById('cp').style.display = 'none'; }
  document.getElementById('cp').onclick = function(){
    var ok = function(){ var t = document.getElementById('toast'); t.textContent = 'Conteúdo copiado'; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function(){ prompt('Copie:', txt); }); else prompt('Copie:', txt);
  };
})();
</script>
</body>
</html>
